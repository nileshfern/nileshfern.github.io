name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: hugo-site

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node.js dependencies
        # `npm ci` chokes on a known npm quirk with nested platform-optional dependencies
        # (lightningcss's musl variant loses its "version" field when hoisted under certain
        # npm versions) even though the lockfile installs fine locally. `npm install` re-resolves
        # instead of validating the lockfile exactly, which sidesteps it.
        run: npm install

      - name: Add node_modules/.bin to PATH
        # Hugo's TailwindCSS integration shells out to the `tailwindcss` binary; it must be
        # discoverable on PATH, not just present in node_modules.
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          TZ: America/New_York
        # baseURL is hardcoded to the final https:// site address rather than derived from
        # steps.pages.outputs.base_url, which can resolve to http:// and poison the sitemap/canonical URLs.
        run: hugo --gc --minify --baseURL "https://www.nileshfernando.com/"

      - name: Build Pagefind search index
        run: npx pagefind --site public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./hugo-site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
